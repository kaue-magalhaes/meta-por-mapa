# Gera o site com os dados do Brawl Time Ninja e publica no GitHub Pages.
# Roda a cada 3 horas e também pelo botão "Run workflow". Se a geração falhar,
# o site continua no ar com os dados da última vez que deu certo.
name: Atualizar o site

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma rodada por vez: a seguinte espera a anterior terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Testes das contas
        run: node --test
      - name: Gerar o site
        run: node atualizar.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: publicar
        uses: actions/deploy-pages@v5
